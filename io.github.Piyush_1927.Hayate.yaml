app-id: io.github.Piyush_1927.Hayate
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.8'
command: hayate

cleanup-commands:
  - /app/cleanup-BaseApp.sh

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '24.08'
    add-ld-path: .

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri

modules:
  - python3-deps.json

  - name: hayate
    buildsystem: simple
    sources:
      - type: dir
        path: .
    build-commands:
      - mkdir -p /app/lib/ffmpeg
      - pip3 install --no-build-isolation --no-deps --prefix=/app .
      - install -Dm644 app_icon.png /app/share/icons/hicolor/256x256/apps/io.github.Piyush_1927.Hayate.png
      - |
        install -Dm644 /dev/stdin /app/share/applications/io.github.Piyush_1927.Hayate.desktop << 'DESKTOP'
        [Desktop Entry]
        Name=Hayate
        Comment=Fast native anime catalog and desktop player
        Exec=hayate
        Icon=io.github.Piyush_1927.Hayate
        Terminal=false
        Type=Application
        Categories=AudioVideo;Player;Network;
        StartupWMClass=hayate
        DESKTOP
